<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarSystems Pro - React Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --primary: #00eaff;
            --primary-dark: #0099aa;
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif; color: #fff;
            background: var(--bg-gradient); min-height: 100vh; overflow-x: hidden;
        }
        button { cursor: pointer; border: none; outline: none; }
        .hidden { display: none !important; }

        /* Loading Screen */
        #loadingScreen {
            position: fixed; inset: 0; background: #0b1418;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; font-weight: 300; letter-spacing: 4px; transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid var(--glass);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        /* Login Screen */
        .loginOverlay {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&q=80&w=1000') center/cover;
            position: relative;
        }
        .loginOverlay::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.7); }

        .loginBox {
            position: relative; background: var(--glass); backdrop-filter: blur(15px);
            padding: 40px; width: 350px; border-radius: 20px; text-align: center;
            border: 1px solid var(--glass-border); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Nav & Cards */
        nav {
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            padding: 15px; display: flex; gap: 10px; justify-content: center;
            position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--glass-border);
        }
        nav button {
            background: transparent; color: #ccc; padding: 10px 18px; border-radius: 12px;
        }
        nav button.active { background: var(--glass); color: var(--primary); }

        section { padding: 50px 20px; animation: slideUp 0.5s ease forwards; }
        .card {
            background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
            max-width: 800px; margin: auto; padding: 40px; border-radius: 24px;
        }
        .main-icon { font-size: 50px; color: var(--primary); display: block; text-align: center; margin-bottom: 20px; }

        .ctrl { padding: 12px 24px; border-radius: 30px; background: var(--primary); color: #000; font-weight: 600; }
        .ctrl-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        .status-badge { display: inline-block; padding: 6px 15px; border-radius: 20px; background: rgba(0,0,0,0.3); border: 1px solid; }
        .on { color: #00ff88; border-color: #00ff88; }
        .off { color: #ff4444; border-color: #ff4444; }

        /* Modal */
        .modalOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center; z-index: 200;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. MODULES (Logic separation) ---
        const AuthModule = {
            regex: /^\d{4}$/,
            validate: (code) => AuthModule.regex.test(code)
        };

        const DataModule = {
            inventory: ["V8 Engine Block", "Twin Turbochargers", "Cooling Unit", "ECU Module"]
        };

        // --- 2. REACT CLASS COMPONENT (Specific Concept) ---
        class TechnicalSpecs extends React.Component {
            render() {
                return (
                    <div style={{marginTop: '20px', fontSize: '12px', opacity: 0.6}}>
                        Hardware ID: {this.props.id} | Firmware: {this.props.version}
                    </div>
                );
            }
        }

        // --- 3. REACT FUNCTIONAL COMPONENTS & PROPS ---
        const NavItem = ({ id, activePage, label, icon, onClick }) => (
            <button 
                onClick={() => onClick(id)} 
                className={activePage === id ? 'active' : ''}
            >
                <i className={`fa ${icon}`}></i> {label}
            </button>
        );

        // --- 4. MAIN APP (Hooks, Event Handling, Routing, Lists, Conditionals) ---
        function CarApp() {
            // State Hooks
            const [loading, setLoading] = React.useState(true);
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [currentPage, setCurrentPage] = React.useState('home');
            const [user, setUser] = React.useState({ name: 'Admin', code: '1234' });
            const [engineOn, setEngineOn] = React.useState(false);
            const [showFact, setShowFact] = React.useState(false);
            const [modal, setModal] = React.useState({ open: false, title: '', body: '' });
            const [quizResult, setQuizResult] = React.useState({ text: '', color: '' });

            // Effect Hook for Loading Simulation
            React.useEffect(() => {
                const timer = setTimeout(() => setLoading(false), 1500);
                return () => clearTimeout(timer);
            }, []);

            // Event Handlers
            const handleLogin = () => {
                if (user.name.trim() !== "" && AuthModule.validate(user.code)) {
                    setIsLoggedIn(true);
                } else {
                    alert("Invalid Credentials. Access Code must be 4 digits.");
                }
            };

            const handleQuiz = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const answer = formData.get('q1');
                if (answer === 'b') {
                    setQuizResult({ text: '✓ Verified: Knowledge accurate.', color: '#00ff88' });
                } else {
                    setQuizResult({ text: 'X Access Denied: Incorrect protocol.', color: '#ff4444' });
                }
            };

            // React Render Conditionals (Loading & Login)
            if (loading) {
                return (
                    <div id="loadingScreen">
                        <div className="spinner"></div>
                        <p>INITIALIZING SYSTEMS</p>
                    </div>
                );
            }

            if (!isLoggedIn) {
                return (
                    <div className="loginOverlay">
                        <div className="loginBox">
                            <i className="fa-solid fa-shield-halved" style={{fontSize: '40px', color: 'var(--primary)', marginBottom: '15px'}}></i>
                            <h2>System Login</h2>
                            <input 
                                value={user.name} 
                                onChange={(e) => setUser({...user, name: e.target.value})} 
                                placeholder="Operator Name" 
                            />
                            <input 
                                type="password" 
                                value={user.code} 
                                onChange={(e) => setUser({...user, code: e.target.value})} 
                                placeholder="Access Code" 
                            />
                            <button className="ctrl" style={{width: '100%'}} onClick={handleLogin}>Authorize</button>
                        </div>
                    </div>
                );
            }

            return (
                <div id="siteWrapper">
                    {/* Routing Implementation */}
                    <nav>
                        <NavItem id="home" activePage={currentPage} label="Dashboard" icon="fa-house" onClick={setCurrentPage} />
                        <NavItem id="engine" activePage={currentPage} label="Engine" icon="fa-microchip" onClick={setCurrentPage} />
                        <NavItem id="assess" activePage={currentPage} label="Assessment" icon="fa-clipboard-check" onClick={setCurrentPage} />
                        <NavItem id="feed" activePage={currentPage} label="Feedback" icon="fa-comment" onClick={setCurrentPage} />
                    </nav>

                    {/* Dashboard Section */}
                    {currentPage === 'home' && (
                        <section>
                            <div className="card">
                                <i className="fa fa-car-side main-icon"></i>
                                <h1>Vehicle Overview</h1>
                                <p style={{textAlign: 'center', opacity: 0.8}}>Welcome, {user.name}. All systems standby.</p>
                                <div className="controls" style={{display: 'flex', justifyContent: 'center', gap: '10px'}}>
                                    <button className="ctrl" onClick={() => setCurrentPage('engine')}>System Check</button>
                                    <button className="ctrl ctrl-outline" onClick={() => setShowFact(!showFact)}>Quick Fact</button>
                                </div>
                                {showFact && (
                                    <div style={{textAlign: 'center', padding: '15px', background: 'rgba(0,234,255,0.1)', borderRadius: '10px', marginTop: '20px'}}>
                                        <i className="fa fa-lightbulb" style={{color: 'var(--primary)'}}></i> A Modern V8 engine has hundreds of moving parts.
                                    </div>
                                )}
                            </div>
                        </section>
                    )}

                    {/* Engine Section */}
                    {currentPage === 'engine' && (
                        <section>
                            <div className="card">
                                <i className="fa fa-gauge-high main-icon"></i>
                                <h1>Engine Management</h1>
                                <div style={{textAlign: 'center', marginBottom: '20px'}}>
                                    Ignition: <span className={`status-badge ${engineOn ? 'on' : 'off'}`}>{engineOn ? 'ACTIVE' : 'DISENGAGED'}</span>
                                </div>
                                <div style={{display: 'flex', justifyContent: 'center', gap: '10px'}}>
                                    <button className="ctrl" onClick={() => setEngineOn(!engineOn)}>{engineOn ? 'Stop Engine' : 'Start Engine'}</button>
                                    <button className="ctrl ctrl-outline" onClick={() => setModal({open: true, title: 'V8 Specs', body: '4.0L Twin-Turbo V8 with 500hp.'})}>Specs</button>
                                </div>
                                {engineOn && (
                                    <div style={{textAlign: 'center', marginTop: '20px'}}>
                                        <i className="fa fa-fan fa-spin" style={{fontSize: '40px', color: 'var(--primary)'}}></i>
                                        <p>Cooling Fans Active</p>
                                    </div>
                                )}
                                <TechnicalSpecs id="X-900" version="v2.0.4" />
                            </div>
                        </section>
                    )}

                    {/* Assessment Section (React Forms) */}
                    {currentPage === 'assess' && (
                        <section>
                            <div className="card">
                                <i className="fa fa-graduation-cap main-icon"></i>
                                <h1>Knowledge Test</h1>
                                <form onSubmit={handleQuiz}>
                                    <div style={{background: 'rgba(0,0,0,0.2)', padding: '15px', borderRadius: '10px', marginBottom: '20px'}}>
                                        <p>1. What is required before shifting to 'Drive' (D)?</p>
                                        <label><input type="radio" name="q1" value="a" /> Fuel Levels</label><br/>
                                        <label><input type="radio" name="q1" value="b" /> Engine Active</label>
                                    </div>
                                    <button className="ctrl" type="submit">Validate</button>
                                </form>
                                <p style={{textAlign: 'center', color: quizResult.color}}>{quizResult.text}</p>
                            </div>
                        </section>
                    )}

                    {/* Feedback Section (React Lists) */}
                    {currentPage === 'feed' && (
                        <section>
                            <div className="card">
                                <h1>Diagnostics Feedback</h1>
                                <p>Common Issues History:</p>
                                <ul>
                                    {DataModule.inventory.map((item, index) => (
                                        <li key={index} style={{color: 'var(--primary)', marginBottom: '5px'}}>{item} - OK</li>
                                    ))}
                                </ul>
                                <form onSubmit={(e) => { e.preventDefault(); alert('Feedback Received'); }} style={{display: 'flex', flexDirection: 'column', gap: '10px'}}>
                                    <textarea placeholder="Report anomaly..." style={{padding: '12px', background: 'rgba(255,255,255,0.05)', color: '#fff', border: 'none'}} />
                                    <button className="ctrl" type="submit">Send Report</button>
                                </form>
                            </div>
                        </section>
                    )}

                    {/* Modal Concept */}
                    {modal.open && (
                        <div className="modalOverlay">
                            <div className="card" style={{maxWidth: '400px', textAlign: 'center'}}>
                                <h3>{modal.title}</h3>
                                <p>{modal.body}</p>
                                <button className="ctrl" onClick={() => setModal({...modal, open: false})}>Dismiss</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 5. REACT RENDER HTML ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CarApp />);
    </script>
</body>
</html>
